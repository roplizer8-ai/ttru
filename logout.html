<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم تسجيل الخروج</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .logout-container {
            text-align: center;
            padding: 40px;
        }
        .logout-container h2 {
            margin-bottom: 20px;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 500px;">
        <header class="header">
            <img src="logo.png" alt="شعار الشبكة" class="logo">
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider-toggle round"></div>
                </label>
            </div>
        </header>
        <main class="main-content">
            <div class="logout-container">
                <h2>تم تسجيل الخروج بنجاح!</h2>
                <p>شكراً لاستخدامك شبكتنا. نأمل أن نراك قريباً.</p>
                <a href="$(link-login)" class="btn-login" style="margin-top: 20px; display: inline-block; text-decoration: none;">تسجيل الدخول مرة أخرى</a>
            </div>
        </main>
        <footer class="footer">
            <p>جميع الحقوق محفوظة &copy; 2025</p>
        </footer>
    </div>
</body>
</html>
