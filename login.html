<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول إلى الشبكة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="logo.png" alt="شعار الشبكة" class="logo">
        </header>
        <main class="main-content">
            <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
                <input type="hidden" name="dst" value="$(link-orig)">
                <input type="hidden" name="popup" value="true">

                $(if chap-id)
                <input type="hidden" name="chap_id" value="$(chap-id)">
                <input type="hidden" name="chap_challenge" value="$(chap-challenge)">
                <input type="hidden" name="response">
                $(endif)

                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input id="username" name="username" type="text" value="$(username)" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input id="password" name="password" type="password" label="Password" required>
                </div>
                <button type="submit" class="btn-login">تسجيل الدخول</button>
            </form>
            $(if error)
            <div class="error-message">
                $(error)
            </div>
            $(endif)
        </main>
        <aside class="sidebar">
            <div class="ad-space">
                <h3>مساحة إعلانية</h3>
                <p>هنا يمكنك وضع إعلاناتك.</p>
            </div>
        </aside>
        <footer class="footer">
            <p>جميع الحقوق محفوظة &copy; 2025</p>
        </footer>
    </div>
    <script src="md5.js"></script>
    <script src="script.js"></script>
</body>
</html>
