<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-T">
    <meta http-equiv="refresh" content="60">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حالة الاتصال</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .status-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        .status-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: right;
        }
        .status-table td:first-child {
            font-weight: bold;
            color: var(--primary-color);
        }
        .btn-refresh {
            background-color: var(--secondary-color);
        }
        .btn-refresh:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 500px;">
        <header class="header">
            <img src="logo.png" alt="شعار الشبكة" class="logo">
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider-toggle round"></div>
                </label>
            </div>
        </header>
        <main class="main-content">
            <h2 style="text-align: center; margin-bottom: 20px;">مرحباً بك, $(username)!</h2>

            <table class="status-table">
                <tr>
                    <td>عنوان IP</td>
                    <td>$(ip)</td>
                </tr>
                <tr>
                    <td>البيانات المرفوعة</td>
                    <td>$(bytes-out-nice)</td>
                </tr>
                <tr>
                    <td>البيانات المحملة</td>
                    <td>$(bytes-in-nice)</td>
                </tr>
                <tr>
                    <td>الوقت المنقضي</td>
                    <td>$(uptime)</td>
                </tr>
                $(if session-time-left)
                <tr>
                    <td>الوقت المتبقي</td>
                    <td>$(session-time-left)</td>
                </tr>
                $(endif)
            </table>

            <form name="logout" action="$(link-logout)" method="post">
                <button type="submit" class="btn-login" style="margin-top: 20px;">تسجيل الخروج</button>
            </form>
            <form>
               <button type="submit" class="btn-login btn-refresh" style="margin-top: 10px;">تحديث</button>
            </form>
        </main>
        <footer class="footer">
            <p>للاطلاع على حالة الاتصال، قم بزيارة <a href="$(link-status)" style="color: white;">$(link-status)</a></p>
        </footer>
    </div>
</body>
</html>
