<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="300">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang="ar">حالة الاتصال</title>
    <title data-lang="en" style="display:none;">Connection Status</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>


    <div class="login-wrapper">
        <div class="login-branding-container">
            <img src="logo.png" alt="شعار الشبكة" class="logo">
        </div>
        <div class="login-form-container">
            <header class="header" style="padding: 0; border: none; justify-content: space-between;">
                <h2 id="greeting"></h2>
                 <div class="theme-switch-wrapper">
                    <label class="theme-switch" for="checkbox">
                        <input type="checkbox" id="checkbox" />
                        <div class="slider-toggle round"></div>
                    </label>
                </div>
            </header>

            <div class="status-info">
                <p><strong data-lang="ar">اسم المستخدم:</strong><strong data-lang="en" style="display:none;">Username:</strong> $(username)</p>
                <p><strong data-lang="ar">عنوان IP:</strong><strong data-lang="en" style="display:none;">IP Address:</strong> $(ip)</p>
            </div>

            <div class="charts-container" style="display:flex; justify-content: space-around; margin-top: 20px;">
                <div class="chart-wrapper" style="width: 120px; height: 120px;">
                    <canvas id="uptime-chart"></canvas>
                    <div class="chart-label" data-lang="ar">الوقت المتبقي</div>
                    <div class="chart-label" data-lang="en" style="display:none;">Time Left</div>
                </div>
                <div class="chart-wrapper" style="width: 120px; height: 120px;">
                    <canvas id="data-chart"></canvas>
                    <div class="chart-label" data-lang="ar">البيانات المتبقية</div>
                    <div class="chart-label" data-lang="en" style="display:none;">Data Left</div>
                </div>
            </div>

            <form name="logout" action="$(link-logout)" method="post" style="margin-top: 30px;">
                <button type="submit" class="btn-login" data-lang="ar">تسجيل الخروج</button>
                <button type="submit" class="btn-login" data-lang="en" style="display:none;">Logout</button>
            </form>

            <footer style="text-align: center; margin-top: auto; padding-top: 20px;">
                <a href="$(link-status)" data-lang="ar">تحديث</a>
                <a href="$(link-status)" data-lang="en" style="display:none;">Refresh</a>
                 |
                <button id="lang-toggle">English</button>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Greeting Script
        const greetingEl = document.getElementById('greeting');
        const hours = new Date().getHours();
        const lang = document.documentElement.lang || 'ar';

        let greetingText;
        if (lang === 'ar') {
            if (hours < 12) greetingText = 'صباح الخير';
            else if (hours < 18) greetingText = 'مساء الخير';
            else greetingText = 'طاب مساؤك';
            greetingEl.textContent = `${greetingText}, $(username)!`;
        } else {
            if (hours < 12) greetingText = 'Good morning';
            else if (hours < 18) greetingText = 'Good afternoon';
            else greetingText = 'Good evening';
            greetingEl.textContent = `${greetingText}, $(username)!`;
        }

        // --- DATA VISUALIZATION ---
        // NOTE: The chart data below is STATIC for demonstration purposes.
        // In a real MikroTik environment, you would replace the 'data' arrays
        // with dynamic values parsed from MikroTik's status page variables.
        // For example: data: [parseInt('$(session-time-left)'), parseInt('$(session-time-total)') - parseInt('$(session-time-left)')]

        // Uptime chart
        const uptimeData = [75, 25]; // Static example: 75% used
        new Chart('uptime-chart', {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: uptimeData,
                    backgroundColor: ['#3F9BFF', '#e0e0e0'],
                    borderWidth: 0
                }]
            },
            options: { cutout: '70%', plugins: { legend: { display: false }, tooltip: { enabled: false } } }
        });

        // Data chart
        const dataUsageData = [50, 50]; // Static example: 50% used
        new Chart('data-chart', {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: dataUsageData,
                    backgroundColor: ['#28A745', '#e0e0e0'],
                    borderWidth: 0
                }]
            },
            options: { cutout: '70%', plugins: { legend: { display: false }, tooltip: { enabled: false } } }
        });
    </script>
</body>
</html>
