<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول بالكارت</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="logo.png" alt="شعار الشبكة" class="logo">
        </header>
        <main class="main-content">
            <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
                <input type="hidden" name="dst" value="$(link-orig)">
                <input type="hidden" name="popup" value="true">

                <div class="form-group">
                    <label for="username">كود الكارت</label>
                    <input id="username" name="username" type="text" value="$(username)" required>
                </div>
                <!-- In voucher systems, password is often the same as the username -->
                <input id="password" name="password" type="hidden">

                <button type="submit" class="btn-login">دخول</button>
            </form>

            <div style="text-align: center; margin-top: 15px;">
                <a href="login.html">تسجيل الدخول باسم مستخدم</a>
            </div>

            $(if error)
            <div class="error-message">
                $(error)
            </div>
            $(endif)

            <hr style="margin-top: 25px;">

            <table class="packages-table">
                <thead>
                    <tr>
                        <th colspan="2">باقات الإنترنت</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>باقة 1 جيجا</td>
                        <td>5 جنيه</td>
                    </tr>
                    <tr>
                        <td>باقة 5 جيجا</td>
                        <td>20 جنيه</td>
                    </tr>
                    <tr>
                        <td>باقة 10 جيجا</td>
                        <td>35 جنيه</td>
                    </tr>
                </tbody>
            </table>
        </main>
        <aside class="sidebar">
            <div class="ad-space">
                <div class="slider">
                    <div class="slide"><img src="img/ad1.svg" alt="Ad 1"></div>
                    <div class="slide"><img src="img/ad2.svg" alt="Ad 2"></div>
                    <!-- Add more slides as needed -->
                </div>
            </div>
        </aside>
        <footer class="footer">
            <p>جميع الحقوق محفوظة &copy; 2025</p>
        </footer>
    </div>
    <script>
        // Function to automatically copy username to password field for voucher login
        document.login.username.onkeyup = function() {
            document.login.password.value = document.login.username.value;
        };
    </script>
    <script src="md5.js"></script>
    <script src="script.js"></script>
</body>
</html>
